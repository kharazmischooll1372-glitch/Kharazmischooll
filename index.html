<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>پیش‌دبستان و دبستان پسرانه حکیم خوارزمی</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Tahoma, Arial, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .container {
    background: #fff;
    border-radius: 24px;
    width: 100%;
    max-width: 700px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    overflow: hidden;
    min-height: 500px;
  }
  .header {
    background: linear-gradient(135deg, #ff6b6b, #feca57);
    padding: 18px 20px;
    text-align: center;
    color: #fff;
    position: relative;
  }
  .header h1 { margin: 0; font-size: 20px; line-height: 1.6; }
  .header .school-name { font-size: 22px; font-weight: 900; display:block; }
  .header .subtitle { font-size: 13px; opacity: 0.9; display:block; margin-top:2px;}

  .social-bar {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-top: 12px;
  }
  .social-btn {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: rgba(255,255,255,0.95);
    display: flex; align-items: center; justify-content: center;
    text-decoration: none;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 3px 8px rgba(0,0,0,0.2);
  }
  .social-btn:hover { transform: scale(1.12) translateY(-2px); box-shadow: 0 6px 14px rgba(0,0,0,0.3); }
  .social-btn svg { width: 22px; height: 22px; }
  .social-label {
    font-size: 11px; color: #fff; margin-top: 4px; opacity: 0.9;
  }
  .socials-wrap { display:flex; gap:20px; justify-content:center; }
  .social-item { display:flex; flex-direction:column; align-items:center; }

  .content { padding: 25px; }

  /* Grade selection */
  .grade-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 14px;
  }
  .grade-card {
    background: #f0f4ff;
    border: 3px solid #a8b8ff;
    border-radius: 16px;
    padding: 18px 10px;
    text-align: center;
    cursor: pointer;
    transition: 0.25s;
    user-select: none;
  }
  .grade-card:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(102,126,234,0.4); background:#e8edff;}
  .grade-card .emoji { font-size: 36px; display:block; margin-bottom:6px;}
  .grade-card .label { font-weight: bold; color: #333; font-size: 15px;}

  /* Quiz */
  .top-bar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 15px;
  }
  .back-btn {
    background: #eee; border: none; border-radius: 10px; padding: 8px 14px;
    cursor: pointer; font-size: 14px; font-family: inherit;
  }
  .progress-wrap {
    background: #eee; border-radius: 20px; height: 12px; flex: 1; margin: 0 12px; overflow: hidden;
  }
  .progress-bar { height: 100%; background: linear-gradient(90deg,#43e97b,#38f9d7); width: 0%; transition: width .3s; }
  .score-badge { font-weight: bold; color: #667eea; font-size: 14px; white-space: nowrap;}

  .question-box {
    background: #f8f9ff;
    border-radius: 18px;
    padding: 25px 20px;
    text-align: center;
    min-height: 100px;
  }
  .question-text { font-size: 20px; font-weight: bold; color: #333; margin-bottom: 8px;}
  .options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 20px;
  }
  .option-btn {
    background: #fff;
    border: 3px solid #cdd6ff;
    border-radius: 14px;
    padding: 16px 8px;
    font-size: 18px;
    cursor: pointer;
    font-family: inherit;
    transition: 0.2s;
  }
  .option-btn:hover:not(:disabled) { background: #eef1ff; transform: scale(1.03); }
  .option-btn.correct { background: #43e97b !important; border-color: #2ecc71 !important; color:#fff; }
  .option-btn.wrong { background: #ff6b6b !important; border-color: #e74c3c !important; color:#fff; }
  .option-btn:disabled { cursor: default; opacity: 0.85;}

  .feedback { margin-top: 14px; font-weight: bold; font-size: 16px; min-height: 24px; }
  .next-btn {
    margin-top: 18px;
    background: linear-gradient(135deg,#667eea,#764ba2);
    color: #fff; border: none; border-radius: 12px;
    padding: 12px 30px; font-size: 16px; cursor: pointer; font-family: inherit;
    display: none;
  }

  /* Result */
  .result-box { text-align: center; }
  .result-emoji { font-size: 60px; }
  .result-title { font-size: 22px; font-weight: bold; margin: 10px 0; color: #333; }
  .result-score { font-size: 40px; font-weight: bold; color: #667eea; margin: 10px 0; }
  .restart-btn {
    background: linear-gradient(135deg,#ff6b6b,#feca57);
    color:#fff; border:none; border-radius: 14px; padding: 14px 30px;
    font-size: 16px; cursor: pointer; margin-top: 10px; font-family: inherit;
  }
  .again-btn {
    background: #eee; color:#333; border:none; border-radius: 14px; padding: 14px 30px;
    font-size: 16px; cursor: pointer; margin-top: 10px; margin-right:10px; font-family: inherit;
  }

  .footer-social {
    display: flex; justify-content: center; gap: 20px; padding: 14px 20px;
    background: #f8f9ff; border-top: 1px solid #eee;
  }
</style>
</head>
<body>

<script>
const grades = [
  { key: 'pre', label: 'پیش‌دبستان', emoji: '🧸' },
  { key: 'g1', label: 'اول دبستان', emoji: '1️⃣' },
  { key: 'g2', label: 'دوم دبستان', emoji: '2️⃣' },
  { key: 'g3', label: 'سوم دبستان', emoji: '3️⃣' },
  { key: 'g4', label: 'چهارم دبستان', emoji: '4️⃣' },
  { key: 'g5', label: 'پنجم دبستان', emoji: '5️⃣' },
  { key: 'g6', label: 'ششم دبستان', emoji: '6️⃣' },
];

const questionBank = {
  pre: [
    { q: "کدام یک دایره است؟", options: ["⚪", "🔺", "⬜", "⭐"], answer: 0 },
    { q: "رنگ این شکل چیست؟ 🍎", options: ["آبی", "قرمز", "سبز", "زرد"], answer: 1 },
    { q: "کدام عدد بزرگتر است؟", options: ["۱", "۵", "۲", "۰"], answer: 1 },
    { q: "کدام یک حیوان است؟", options: ["🚗", "🐱", "📚", "🍌"], answer: 1 },
    { q: "این میوه چیست؟ 🍌", options: ["سیب", "پرتقال", "موز", "انگور"], answer: 2 },
    { q: "کدام شکل مربع است؟", options: ["🔵", "🔺", "⬛", "⭐"], answer: 2 },
    { q: "چند تا ⭐ وجود دارد؟ ⭐⭐⭐", options: ["۲", "۳", "۴", "۱"], answer: 1 },
    { q: "حرف اول کلمه «مادر» چیست؟", options: ["الف", "میم", "دال", "راء"], answer: 1 },
  ],
  g1: [
    { q: "۲ + ۳ = ؟", options: ["۴", "۵", "۶", "۷"], answer: 1 },
    { q: "کدام کلمه درست نوشته شده؟", options: ["کتاب", "کیتاب", "کتاپ", "کتاب‌ب"], answer: 0 },
    { q: "۷ - ۴ = ؟", options: ["۲", "۳", "۴", "۵"], answer: 1 },
    { q: "بعد از عدد ۹ کدام عدد می‌آید؟", options: ["۸", "۱۰", "۱۱", "۷"], answer: 1 },
    { q: "کدام حرف، حرف «سین» است؟", options: ["س", "ش", "ص", "ز"], answer: 0 },
    { q: "۵ + ۵ = ؟", options: ["۹", "۱۰", "۱۱", "۸"], answer: 1 },
    { q: "کدام یک جمع است نه مفرد؟", options: ["کتاب", "کتاب‌ها", "میز", "در"], answer: 1 },
    { q: "۱۰ - ۶ = ؟", options: ["۳", "۴", "۵", "۶"], answer: 1 },
  ],
  g2: [
    { q: "۱۵ + ۲۷ = ؟", options: ["۴۰", "۴۱", "۴۲", "۴۳"], answer: 2 },
    { q: "۵۰ - ۱۸ = ؟", options: ["۳۰", "۳۱", "۳۲", "۳۳"], answer: 2 },
    { q: "کدام کلمه هم‌خانواده «علم» است؟", options: ["معلم", "عالم", "علوم", "همه موارد"], answer: 3 },
    { q: "۹ × ۲ = ؟", options: ["۱۶", "۱۷", "۱۸", "۱۹"], answer: 2 },
    { q: "نصف عدد ۲۰ کدام است؟", options: ["۵", "۱۰", "۱۵", "۲۰"], answer: 1 },
    { q: "جمع اعداد ۱۲ و ۱۳ چند می‌شود؟", options: ["۲۴", "۲۵", "۲۶", "۲۷"], answer: 1 },
    { q: "مخالف کلمه «بزرگ» چیست؟", options: ["کوچک", "زیبا", "تند", "کند"], answer: 0 },
    { q: "۴۴ - ۲۰ = ؟", options: ["۲۲", "۲۳", "۲۴", "۲۵"], answer: 2 },
  ],
  g3: [
    { q: "۷ × ۶ = ؟", options: ["۴۰", "۴۱", "۴۲", "۴۳"], answer: 2 },
    { q: "۸ × ۸ = ؟", options: ["۶۲", "۶۴", "۶۶", "۶۸"], answer: 1 },
    { q: "کدام یک از حالات ماده است؟", options: ["جامد، مایع، گاز", "سرد و گرم", "بزرگ و کوچک", "روز و شب"], answer: 0 },
    { q: "۵۶ ÷ ۷ = ؟", options: ["۷", "۸", "۹", "۶"], answer: 1 },
    { q: "منبع اصلی نور در روز چیست؟", options: ["ماه", "خورشید", "ستاره", "چراغ"], answer: 1 },
    { q: "۹ × ۵ = ؟", options: ["۴۰", "۴۵", "۵۰", "۳۵"], answer: 1 },
    { q: "کدام اندام برای تنفس است؟", options: ["قلب", "معده", "ریه", "کبد"], answer: 2 },
    { q: "۶۳ ÷ ۹ = ؟", options: ["۶", "۷", "۸", "۹"], answer: 1 },
  ],
  g4: [
    { q: "کسر ۱/۲ برابر است با کدام درصد؟", options: ["۲۰٪", "۵۰٪", "۷۵٪", "۱۰۰٪"], answer: 1 },
    { q: "بزرگترین قاره جهان کدام است؟", options: ["آفریقا", "آسیا", "اروپا", "آمریکا"], answer: 1 },
    { q: "۱۲۵ + ۲۴۸ = ؟", options: ["۳۷۱", "۳۷۲", "۳۷۳", "۳۷۴"], answer: 2 },
    { q: "آب در چند درجه سانتی‌گراد می‌جوشد؟", options: ["۵۰", "۷۵", "۱۰۰", "۱۲۰"], answer: 2 },
    { q: "کدام یک منبع انرژی تجدیدپذیر است؟", options: ["نفت", "زغال‌سنگ", "خورشید", "گاز"], answer: 2 },
    { q: "۳/۴ + ۱/۴ = ؟", options: ["۱", "۲/۴", "۴/۴", "۱/۲"], answer: 0 },
    { q: "پایتخت ایران کدام شهر است؟", options: ["اصفهان", "تهران", "شیراز", "مشهد"], answer: 1 },
    { q: "۹۹۹ - ۴۵۶ = ؟", options: ["۵۴۲", "۵۴۳", "۵۴۴", "۵۴۵"], answer: 1 },
  ],
  g5: [
    { q: "۲/۳ + ۱/۶ = ؟", options: ["۵/۶", "۳/۹", "۱/۲", "۴/۶"], answer: 0 },
    { q: "کدام سیاره نزدیک‌ترین به خورشید است؟", options: ["زمین", "مریخ", "عطارد", "زهره"], answer: 2 },
    { q: "مساحت مربع با ضلع ۶ چقدر است؟", options: ["۱۲", "۲۴", "۳۶", "۴۸"], answer: 2 },
    { q: "دستگاه گردش خون شامل کدام است؟", options: ["قلب و رگ‌ها", "معده و روده", "مغز و اعصاب", "ریه و نای"], answer: 0 },
    { q: "۱۵٪ از عدد ۲۰۰ چند است؟", options: ["۲۰", "۲۵", "۳۰", "۳۵"], answer: 2 },
    { q: "کدام گاز برای تنفس ما ضروری است؟", options: ["نیتروژن", "اکسیژن", "دی‌اکسید کربن", "هیدروژن"], answer: 1 },
    { q: "محیط دایره با شعاع ۷ (تقریبی π=۲۲/۷) چقدر است؟", options: ["۳۸", "۴۰", "۴۲", "۴۴"], answer: 3 },
    { q: "بزرگترین اقیانوس جهان کدام است؟", options: ["اطلس", "هند", "آرام", "منجمد"], answer: 2 },
  ],
  g6: [
    { q: "میانگین اعداد ۴، ۶ و ۸ چقدر است؟", options: ["۵", "۶", "۷", "۸"], answer: 1 },
    { q: "دستگاه تنفس شامل کدام است؟", options: ["بینی، نای، ریه", "قلب و رگ‌ها", "مغز و نخاع", "معده و کبد"], answer: 0 },
    { q: "حجم مکعب با ضلع ۳ چقدر است؟", options: ["۹", "۱۸", "۲۱", "۲۷"], answer: 3 },
    { q: "کدام یک از اجزای سلول است؟", options: ["هسته", "برگ", "ریشه", "ساقه"], answer: 0 },
    { q: "۲۵٪ از ۴۰۰ چقدر است؟", options: ["۸۰", "۹۰", "۱۰۰", "۱۱۰"], answer: 2 },
    { q: "نیروی جاذبه زمین باعث چه چیزی می‌شود؟", options: ["پرواز اجسام", "سقوط اجسام به پایین", "شناور شدن اجسام", "چرخش زمین"], answer: 1 },
    { q: "عدد اول کدام است؟", options: ["۴", "۶", "۷", "۹"], answer: 2 },
    { q: "کدام ماده رسانای خوب الکتریسیته است؟", options: ["چوب", "پلاستیک", "مس", "شیشه"], answer: 2 },
  ],
};

let currentGrade = null;
let currentIndex = 0;
let score = 0;
let questions = [];

const content = document.getElementById('content');

function showGradeSelection() {
  currentGrade = null;
  let html = '<div class="grade-grid">';
  grades.forEach(g => {
    html += `<div class="grade-card" onclick="startQuiz('${g.key}')">
      <span class="emoji">${g.emoji}</span>
      <span class="label">${g.label}</span>
    </div>`;
  });
  html += '</div>';
  content.innerHTML = html;
}

function startQuiz(gradeKey) {
  currentGrade = gradeKey;
  questions = [...questionBank[gradeKey]];
  currentIndex = 0;
  score = 0;
  renderQuestion();
}

function renderQuestion() {
  const total = questions.length;
  const q = questions[currentIndex];
  const progress = Math.round((currentIndex / total) * 100);
  const gradeLabel = grades.find(g => g.key === currentGrade).label;

  let html = `
    <div class="top-bar">
      <button class="back-btn" onclick="showGradeSelection()">🔙 بازگشت</button>
      <div class="progress-wrap"><div class="progress-bar" style="width:${progress}%"></div></div>
      <div class="score-badge">امتیاز: ${score}</div>
    </div>
    <div style="text-align:center; color:#764ba2; font-weight:bold; margin-bottom:10px;">
      ${gradeLabel} — سوال ${currentIndex + 1} از ${total}
    </div>
    <div class="question-box">
      <div class="question-text">${q.q}</div>
      <div class="options">
        ${q.options.map((opt, i) => `<button class="option-btn" onclick="checkAnswer(${i})">${opt}</button>`).join('')}
      </div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="nextBtn" onclick="nextQuestion()">سوال بعدی ⬅</button>
    </div>
  `;
  content.innerHTML = html;
}

function checkAnswer(selected) {
  const q = questions[currentIndex];
  const buttons = document.querySelectorAll('.option-btn');
  buttons.forEach(b => b.disabled = true);

  if (selected === q.answer) {
    buttons[selected].classList.add('correct');
    document.getElementById('feedback').innerHTML = '✅ آفرین! درست بود';
    document.getElementById('feedback').style.color = '#2ecc71';
    score++;
  } else {
    buttons[selected].classList.add('wrong');
    buttons[q.answer].classList.add('correct');
    document.getElementById('feedback').innerHTML = '❌ اشتباه بود، جواب درست مشخص شد';
    document.getElementById('feedback').style.color = '#e74c3c';
  }
  document.getElementById('nextBtn').style.display = 'inline-block';
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex < questions.length) {
    renderQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  const total = questions.length;
  const percent = Math.round((score / total) * 100);
  let emoji = '🎉';
  let msg = 'عالی بود!';
  if (percent < 50) { emoji = '💪'; msg = 'باید بیشتر تمرین کنی!'; }
  else if (percent < 80) { emoji = '👍'; msg = 'خوب بود، ادامه بده!'; }

  content.innerHTML = `
    <div class="result-box">
      <div class="result-emoji">${emoji}</div>
      <div class="result-title">${msg}</div>
      <div class="result-score">${score} / ${total}</div>
      <div style="color:#666; margin-bottom:10px;">درصد موفقیت: ${percent}٪</div>
      <button class="again-btn" onclick="startQuiz('${currentGrade}')">🔁 تلاش دوباره</button>
      <button class="restart-btn" onclick="showGradeSelection()">🎓 انتخاب پایه دیگر</button>
    </div>
  `;
}

showGradeSelection();
</script>
</body>
